name: Deploy Portfolio Website

on:
  push:
    branches:
      - main
      - staging

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  prepare-artifacts:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Code
          uses: actions/checkout@v7

        - name: Set up Node.js & Build Frontend
          uses: actions/setup-node@v7
          with:
            node-version: 24
        - run: |
            cd frontend
            npm install
            npm run build

        - uses: actions/upload-artifact@v7
          with:
            name: frontend-out
            path: frontend/out


  deploy-production:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: prepare-artifacts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Website Build
        uses: actions/download-artifact@v7
        with:
          name: frontend-out
          path: frontend/out

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsS3Upload
          aws-region: us-east-1

      - name: Sync website files to S3
        run: |
          aws s3 sync frontend/out s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Distribution
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION }} --paths "/*"
